settings:
    lib_name: inv
    results_dir: Charlib/results
    temperature: 27
    logic_thresholds:
        low: 0.2
        high: 0.8
        rising: 0.5
        falling: 0.5
    named_nodes:
        primary_power:
            name: VDD
            voltage: 1.8
        primary_ground:
            name: VSS
            voltage: 0
    simulation:
        backend: ngspice-shared
        input_capacitance_procedure: charge_integration
    units:
        time: ns
        voltage: V
        current: uA
        leakage_power: nW
        capacitive_load: pF
        energy: fJ

cells:
    inv:
        netlist: Spice_Netlist/inv_charlib.spice
        models: [/foss/pdks/sky130A/libs.tech/ngspice/sky130.lib.spice tt]
        inputs: [VIN]
        outputs: [VOUT]
        functions: [VOUT=!VIN]
        data_slews: [0.01, 0.1, 1.0]
        loads: [0.0005, 0.01, 0.1]
        area: 5.344
